<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crflow - Submit Post</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f0f1e;
      color: #e0e0e0;
    }
    
    header {
      background: #1a1a2e;
      border-bottom: 2px solid #00d4ff;
      padding: 20px 0;
      margin-bottom: 30px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #00d4ff;
    }
    
    .header-nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    
    .header-nav a {
      color: #00d4ff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    
    .header-nav a:hover {
      color: #00f0ff;
    }
    
    .form-container {
      background: #1a1a2e;
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 30px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #00d4ff;
    }
    
    input,
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #00d4ff;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      background: #16213e;
      color: #e0e0e0;
    }
    
    input:focus,
    textarea:focus {
      outline: none;
      border-color: #00f0ff;
      box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.2);
      background: #1f2d47;
    }
    
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    
    button {
      background: #00d4ff;
      color: #0f0f1e;
      border: none;
      padding: 12px 24px;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover {
      background: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }
    
    button:active {
      background: #00b8cc;
    }
    
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    
    .success {
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid #00d4ff;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 20px;
      color: #00d4ff;
      display: none;
    }
    
    .error {
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid #ff6464;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 20px;
      color: #ff8888;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>crflow</h1>
      <nav class="header-nav">
        <a href="index.html">Home</a>
        <a href="submit.html">Submit Post</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-container">
      <h2 style="margin-bottom: 20px; color: #00d4ff;">Submit a Post</h2>
      
      <div id="success" class="success">
        Post submitted successfully! <a href="index.html">View posts</a>
      </div>
      
      <div id="error" class="error"></div>
      
      <form id="submitForm">
        <div class="form-group">
          <label for="title">Title *</label>
          <input type="text" id="title" name="title" required>
        </div>

        <div class="form-group">
          <label for="url">URL *</label>
          <input type="url" id="url" name="url" required>
        </div>

        <div class="form-group">
          <label for="context">Description *</label>
          <textarea id="context" name="context" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="submitter_name">Your Name *</label>
            <input type="text" id="submitter_name" name="submitter_name" required>
          </div>

          <div class="form-group">
            <label for="submitter_email">Your Email *</label>
            <input type="email" id="submitter_email" name="submitter_email" required>
          </div>
        </div>

        <button type="submit" id="submitBtn">Submit Post</button>
      </form>
    </div>
  </main>

  <script>
    const POSTS_API = '/posts';
    const form = document.getElementById('submitForm');
    const submitBtn = document.getElementById('submitBtn');
    const successDiv = document.getElementById('success');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      successDiv.style.display = 'none';
      errorDiv.style.display = 'none';

      const data = {
        title: document.getElementById('title').value,
        url: document.getElementById('url').value,
        context: document.getElementById('context').value,
        submitter_name: document.getElementById('submitter_name').value,
        submitter_email: document.getElementById('submitter_email').value
      };

      try {
        const response = await fetch(POSTS_API, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Failed to submit post');
        }

        successDiv.style.display = 'block';
        form.reset();
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 2000);
      } catch (error) {
        console.error('Error submitting post:', error);
        errorDiv.textContent = error.message;
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
