<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>crflow - Recent Posts</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #0f0f1e;
      color: #e0e0e0;
    }
    
    header {
      background: #1a1a2e;
      border-bottom: 2px solid #00d4ff;
      padding: 20px 0;
      margin-bottom: 30px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0 20px;
    }
    
    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #00d4ff;
    }
    
    .header-nav {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    
    .header-nav a {
      color: #00d4ff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    
    .header-nav a:hover {
      color: #00f0ff;
    }
    
    .posts-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .post {
      background: #1a1a2e;
      border: 1px solid #00d4ff;
      border-radius: 8px;
      padding: 20px;
      transition: all 0.2s;
    }
    
    .post:hover {
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
      border-color: #00f0ff;
    }
    
    .post-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .post-title a {
      color: #00d4ff;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    .post-title a:hover {
      color: #00f0ff;
    }
    
    .post-context {
      color: #b0b0b0;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    
    .post-meta {
      display: flex;
      gap: 20px;
      font-size: 14px;
      color: #808080;
    }
    
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #808080;
    }
    
    .error {
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid #ff6464;
      border-radius: 8px;
      padding: 20px;
      color: #ff8888;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <h1>crflow</h1>
      <nav class="header-nav">
        <a href="index.html">Home</a>
        <a href="submit.html">Submit Post</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="posts" class="posts-container">
      <div class="loading">Loading posts...</div>
    </div>
  </main>

  <script>
    const POSTS_API = '/posts';

    async function loadPosts() {
      try {
        const response = await fetch(POSTS_API);
        if (!response.ok) throw new Error('Failed to fetch posts');
        
        const posts = await response.json();
        displayPosts(posts);
      } catch (error) {
        console.error('Error loading posts:', error);
        document.getElementById('posts').innerHTML = `
          <div class="error">Failed to load posts. Please try again later.</div>
        `;
      }
    }

    function displayPosts(posts) {
      const postsDiv = document.getElementById('posts');
      
      if (!posts || posts.length === 0) {
        postsDiv.innerHTML = '<div class="loading">No posts yet.</div>';
        return;
      }

      postsDiv.innerHTML = posts.map(post => `
        <div class="post">
          <div class="post-title">
            <a href="${escapeHtml(post.url)}" target="_blank">${escapeHtml(post.title)}</a>
          </div>
          <div class="post-context">${escapeHtml(post.context)}</div>
          <div class="post-meta">
            <span>by ${escapeHtml(post.submitter_name)}</span>
            <span>${new Date(post.created_at).toLocaleString()}</span>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    loadPosts();
  </script>
</body>
</html>
